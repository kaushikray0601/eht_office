<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">EHT Office calculation workspace preview</title>
  <desc id="desc">A stylized preview of the project data, result, BOQ, cable schedule, and SLD tabs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff8f4"/>
      <stop offset="0.5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff5e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1f2937" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="780" rx="40" fill="url(#sky)"/>
  <g filter="url(#shadow)">
