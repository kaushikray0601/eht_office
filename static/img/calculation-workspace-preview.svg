      <text x="438" y="134" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c2410c">rejected</text>
      <text x="586" y="134" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c2410c">NO_SPIRAL_FACTOR_MATCH</text>
