<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IDF Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .box {
            max-width: 700px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Upload Plant / Isogen IDF</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload and View</button>
        </form>
    </div>
</body>
</html>
