
{% load static %}

<!-- Move it to stylesheet after testing -->
<style>    
   #login .center {
      text-align: center;
    }
    
    #login .login {
      max-width: 300px;
      margin: 35px auto;
    }
    
    #login .login-form{
      padding:0px 25px;
    }
</style>
<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">  
    <!-- Custom CSS -->
    <link href="{% static 'css/base_css.css' %}" rel="stylesheet">
</head>

<body>

<div class="container-fluid col-6 d-flex justify-content-center mt-5">
<div class="card col-6 ">
<div class="col-12 mt-5 ms-5"> 
  <form class="">
    <div class="row mb-3">
      <label for="inputEmail3" class="col-sm-4 col-form-label">Email</label>
      <div class="col-sm-10">
        <input type="email" class="form-control" id="inputEmail3">
      </div>
    </div>
    <div class="row mb-3">
      <label for="inputPassword3" class="col-sm-6 col-form-label">Password</label>
      <div class="col-sm-10">
        <input type="password" class="form-control" id="inputPassword3">
      </div>
    </div>
    
    <div class="row mb-3">
      <div class="col-sm-10 ">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="gridCheck1">
          <label class="form-check-label" for="gridCheck1">
            Remember me
          </label>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Sign in</button>
  </form>

  <div class="span12 mt-5">
    <div class="center">
      <p class="mb-4">New User? <a href="/users/register">Register</a></p>
    </div>
  </div>

</div>
</div>
</div>



</body>
