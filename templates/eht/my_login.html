<!doctype html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — eTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'css/base_css.css' %}" rel="stylesheet">
</head>
<body style="background-color:#e3f2fd; min-height:100vh; display:flex; flex-direction:column; justify-content:center;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none">
                    <span class="eTrace" style="font-size:2rem;">e<span>Trace</span></span>
                </a>
                <p class="text-muted small mt-1 mb-0">Sign in to your account</p>
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
            {% endif %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <input type="text" name="username" class="form-control" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted small mt-4">
                Contact your administrator for access credentials.
            </p>

        </div>
    </div>
</div>

</body>
</html>
